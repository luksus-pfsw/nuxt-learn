# Configure H2 in-memory database for tests
spring.datasource.write.jdbc-url=jdbc:h2:mem:writedb;DB_CLOSE_DELAY=-1
spring.datasource.write.driverClassName=org.h2.Driver
spring.datasource.write.username=sa
spring.datasource.write.password=password

spring.datasource.read.jdbc-url=jdbc:h2:mem:readdb;DB_CLOSE_DELAY=-1
spring.datasource.read.driverClassName=org.h2.Driver
spring.datasource.read.username=sa
spring.datasource.read.password=password

# Disable Flyway for tests
spring.flyway.enabled=false

# Set Hibernate dialect for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
